<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b1c">
  <title>Mizze</title>
  <link rel="stylesheet" href="/mizze/conan/style.css">
  <script src="/mizze/conan/app.js" defer></script>
</head>
<body>
  <div class="scene" aria-hidden="true"></div>

  <main class="stage">
    <section class="screen welcome" id="welcome" aria-label="Mở Mizze">
      <button class="enter-button" id="enter" type="button">
        <span class="play-icon" aria-hidden="true"></span>
        Click
      </button>
    </section>

    <section class="screen loading" id="loading" aria-label="Đang tải Mizze" hidden>
      <div class="loading-content">
        <p class="loading-name">Mizze</p>
        <div class="loading-credits">
          <p class="credit-label">Make By</p>
          <p class="credit-names">
            <span class="credit-mask"><span class="credit-name credit-name--left">HoangHa</span></span>
            <span class="credit-cross">×</span>
            <span class="credit-mask"><span class="credit-name credit-name--right">Đông Nhật</span></span>
          </p>
        </div>
        <div class="loading-track" aria-hidden="true"></div>
      </div>
    </section>

    <section class="screen site" id="site" aria-labelledby="site-title" hidden>
      <header class="topbar">
        <button class="certificate" id="certificate" type="button">
          <span class="certificate-icon" aria-hidden="true"></span>
          Cài chứng chỉ
        </button>
      </header>

      <div class="hero">
        <h1 id="site-title" tabindex="-1">mizze</h1>
        <button class="add-app" id="add-to-happ" type="button">
          Add To Happ
          <span class="arrow" aria-hidden="true">↗</span>
        </button>
      </div>

      <footer class="footer">
        <button class="sound" id="sound" type="button" aria-label="Bật nhạc nền" aria-pressed="false">
          <span class="sound-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        </button>
      </footer>
    </section>
  </main>

  <audio id="background-music" src="/mizze/conan/assets/nhac-nen.mp3" loop preload="auto"></audio>
</body>
</html>
